name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Bundle, build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun for frontend tests
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check frontend modules and theme behavior
        run: npm run check

      - name: Build static landing page and installer
        run: |
          node --check site/app.js
          node scripts/build-site.js
          cmp install.sh site/dist/install.sh
          sh -n install.sh

      # web/app.js is not committed — regenerate it so go:embed has a fresh
      # bundle, and prove the source modules bundle cleanly.
      - name: Bundle web assets
        run: node ./scripts/build-web.js

      - name: Build lilt
        run: go build -trimpath -o lilt ./cmd/lilt

      - name: Run tests
        run: go test -v ./...
